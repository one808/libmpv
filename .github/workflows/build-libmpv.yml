name: Build libmpv DLL

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      mpv_version: ${{ steps.check.outputs.mpv_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Check upstream version
        id: check
        run: |
          UPSTREAM_VERSION=$(curl -s https://raw.githubusercontent.com/mpv-player/mpv/master/MPV_VERSION | tr -d '\n')
          echo "Upstream version: $UPSTREAM_VERSION"
          LAST_VERSION=$(cat .last_build_version 2>/dev/null || echo "none")
          echo "Last built version: $LAST_VERSION"
          if [ "$UPSTREAM_VERSION" = "$LAST_VERSION" ]; then
            echo "Version unchanged, skip build"
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version detected: $UPSTREAM_VERSION"
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "mpv_version=$UPSTREAM_VERSION" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-and-build
    if: needs.check-and-build.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TARGET: i686-w64-mingw32
      PLATFORM: windows-i686
      RUST_TARGET: i686-pc-windows-gnu
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      MPV_VERSION: ${{ needs.check-and-build.outputs.mpv_version }}

    steps:
      - uses: actions/checkout@v7

      - name: Get time
        id: get_time
        run: echo "timestamp=$(date +%s%N)" >> $GITHUB_OUTPUT

      - name: Restore cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mingw32-${{ steps.get_time.outputs.timestamp }}
          restore-keys: mingw32-

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ccache g++-mingw-w64-i686 gcc-multilib python3-pip \
            nasm ninja-build pkg-config wine wine32 git
          python3 -m pip install meson
          rustup target add ${{ env.RUST_TARGET }}
          rustup default nightly

      - name: Clone mpv source
        run: |
          git clone --depth 1 https://github.com/mpv-player/mpv.git /tmp/mpv-source
          cd /tmp/mpv-source
          mkdir -p subprojects
          meson wrap install mujs
          meson subprojects download
          echo "MPV_SOURCE=/tmp/mpv-source" >> $GITHUB_ENV

      - name: Build libmpv DLL
        run: |
          chmod +x ./ci/build-libmpv-wrapper.sh
          ./ci/build-libmpv-wrapper.sh

      - name: Functional test
        run: |
          cd artifact && wine ./libmpv-2.dll || true

      - name: Package artifact
        run: |
          cd artifact
          zip -r ../libmpv-${{ env.PLATFORM }}-${{ env.MPV_VERSION }}.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-${{ env.PLATFORM }}-${{ env.MPV_VERSION }}
          path: libmpv-${{ env.PLATFORM }}-${{ env.MPV_VERSION }}.zip

      - name: Update version record
        run: |
          echo "${{ env.MPV_VERSION }}" > .last_build_version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_build_version
          git commit -m "Build libmpv ${{ env.MPV_VERSION }}" || true
          git push origin main

      - name: Save Cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: ${{ env.CCACHE_DIR }}
          key: mingw32-${{ steps.get_time.outputs.timestamp }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: libmpv-${{ env.PLATFORM }}-${{ env.MPV_VERSION }}
          name: libmpv ${{ env.MPV_VERSION }} (${{ env.PLATFORM }})
          body: |
            Auto-built from mpv ${{ env.MPV_VERSION }}
            Platform: ${{ env.PLATFORM }}
            Commit: ${{ github.sha }}
          files: libmpv-${{ env.PLATFORM }}-${{ env.MPV_VERSION }}.zip
          make_latest: false
